name: ci 

on:
  pull_request:
    branches: [main]

jobs:
  tests:
      name: Tests 
      runs-on: ubuntu-latest

      steps:
      - name: Check out code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.1"
      
      - name: Unit Tests
        run: go test --cover -v ./...

  style:
      name: Style 
      runs-on: ubuntu-latest

      steps:
      - name: Check out code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.1"
      
      - name: Format Go 
        run: test -z $(go fmt ./...)
